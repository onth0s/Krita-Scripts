[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krita-scripts"
version = "1.0.0"
description = "Collection of Krita Python scripts, extensions, dockers, and Blender-style radial pie menu tools."
authors = [{ name = "Leonardo" }]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = [
    "krita_pie_menu*",
    "filters_pie_menu*",
    "operations_pie_menu*",
    "conditions_pie_menu*",
    "quick_script_engine*",
    "dummy_docker*",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

